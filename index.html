<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100E26">
<title>瑞，该睡了</title>
<style>
  :root {
    --night-0: #100E26;
    --cream: #F7EBD5;
    --cream-dim: #ADA6CE;
    --amber: #F2B95C;

    /* 取自 design-to-motion 的曲线 */
    --e:  cubic-bezier(.16, 1, .3, 1);    /* 位移入场 */
    --e2: cubic-bezier(.33, 1, .68, 1);   /* 透明度 / 模糊 */
    --ease: cubic-bezier(.34, 1.4, .64, 1); /* 按钮回弹 */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--night-0);
    color: var(--cream);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    transition: background .9s ease;
  }

  body.asleep { background: #08071A; }

  .page {
    width: min(100%, 460px);
    min-height: 100svh;
    padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
  }

  /* ---------- 入场：6px 上浮 + 2px 模糊转清晰 ---------- */
  .rise, .sky { animation-fill-mode: both; }

  .rise {
    animation-name: rise, defog;
    animation-duration: .8s, .6s;
    animation-timing-function: var(--e), var(--e2);
    animation-delay: var(--d, 0s), var(--d, 0s);
  }

  .sky {
    animation-name: pop, defog;
    animation-duration: .9s, .7s;
    animation-timing-function: var(--e), var(--e2);
  }

  @keyframes rise  { from { transform: translateY(6px); } to { transform: none; } }
  @keyframes pop   { from { transform: scale(.94); } to { transform: none; } }
  @keyframes defog { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: blur(0); } }

  /* ---------- 夜空 ---------- */
  .sky {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 5 / 4;
  }

  .sky svg { width: 100%; height: 100%; overflow: visible; display: block; }

  /* 关灯前是满月，关灯后露出月牙 */
  .moon-full { transition: opacity 1s ease; }
  body.asleep .moon-full { opacity: 0; }

  /* 呼吸般上下浮动 ±2.6px */
  .moon-wrap { animation: bob 2.8s ease-in-out infinite; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2.6px); }
  }

  /* 猫在呼吸 */
  .cat {
    animation: breathe 3.6s ease-in-out infinite;
    transform-box: view-box;
    transform-origin: 200px 180px;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.03, 1.09); }
  }

  .stars circle {
    fill: var(--cream);
    animation: twinkle 4.5s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: .25; }
    50%      { opacity: .85; }
  }

  body.asleep .stars circle { animation-duration: 9s; opacity: .18; }

  .halo { animation: glow 7s ease-in-out infinite; transform-origin: 200px 118px; transform-box: view-box; }

  @keyframes glow {
    0%, 100% { opacity: .5; transform: scale(1); }
    50%      { opacity: .85; transform: scale(1.05); }
  }

  /* 流星由脚本随机生成，关灯后不再出现 */
  .meteor { animation: meteorFly var(--dur, 1s) linear forwards; }

  @keyframes meteorFly {
    0%   { opacity: 0; transform: translate(var(--x), var(--y)); }
    9%   { opacity: 1; }
    62%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(var(--x) - var(--dx)), calc(var(--y) + var(--dy))); }
  }

  body.asleep #meteors { display: none; }

  /* 关灯后飘起的 Zzz */
  .zzz { opacity: 0; transition: opacity .8s ease; }
  body.asleep .zzz { opacity: 1; }

  .zzz text {
    fill: var(--cream-dim);
    font-size: 15px;
    font-family: ui-rounded, "SF Pro Rounded", sans-serif;
    animation: drift 3.6s ease-in-out infinite;
  }

  .zzz text:nth-child(2) { animation-delay: 1.2s; font-size: 12px; }
  .zzz text:nth-child(3) { animation-delay: 2.4s; font-size: 9px; }

  @keyframes drift {
    0%   { opacity: 0; transform: translateY(6px); }
    30%  { opacity: .85; }
    100% { opacity: 0; transform: translateY(-22px); }
  }

  /* ---------- 文案 ---------- */
  .clock {
    margin: 0;
    font-size: 13px;
    letter-spacing: .14em;
    color: var(--cream-dim);
    font-variant-numeric: tabular-nums;
  }

  .headline {
    margin: 0;
    font-size: clamp(30px, 9vw, 44px);
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: .02em;
    text-wrap: balance;
  }

  .note {
    margin: 0;
    font-size: 16px;
    line-height: 1.8;
    color: var(--cream-dim);
    max-width: 24em;
  }

  .note strong { color: var(--cream); font-weight: 600; }

  /* ---------- 按钮 ---------- */
  .lamp {
    margin-top: 6px;
    min-height: 52px;
    padding: 0 30px;
    border: 0;
    border-radius: 999px;
    background: var(--amber);
    color: #2A1B05;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(242, 185, 92, .28);
    transition: transform .22s var(--ease), box-shadow .22s ease, background .3s ease, color .3s ease;
  }

  .lamp:hover  { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(242,185,92,.36); }
  .lamp:active { transform: translateY(0) scale(.97); }
  .lamp:focus-visible { outline: 3px solid var(--cream); outline-offset: 5px; }

  body.asleep .lamp {
    background: transparent;
    color: var(--cream-dim);
    box-shadow: inset 0 0 0 1px rgba(247, 235, 213, .22);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<main class="page">

  <div class="sky">
    <svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一弯月亮上睡着一只猫，夜空里有流星">
      <defs>
        <radialGradient id="glowGrad" cx="50%" cy="50%">
          <stop offset="0%"   stop-color="#F2B95C" stop-opacity=".38"/>
          <stop offset="55%"  stop-color="#F2B95C" stop-opacity=".10"/>
          <stop offset="100%" stop-color="#F2B95C" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="moonFace" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FBD58C"/>
          <stop offset="100%" stop-color="#E9A646"/>
        </linearGradient>
        <linearGradient id="streak" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%"   stop-color="#F7EBD5" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#F7EBD5" stop-opacity="0"/>
        </linearGradient>
        <mask id="boat">
          <rect x="0" y="0" width="400" height="320" fill="#000"/>
          <circle cx="200" cy="128" r="74" fill="#fff"/>
          <circle cx="200" cy="78"  r="58" fill="#000"/>
        </mask>
      </defs>

      <g class="stars" id="stars"></g>

      <g class="moon-wrap">
        <circle class="halo" cx="200" cy="118" r="118" fill="url(#glowGrad)"/>
        <circle class="moon-full" cx="200" cy="128" r="74" fill="url(#moonFace)"/>
        <circle cx="200" cy="128" r="74" fill="url(#moonFace)" mask="url(#boat)"/>

        <g transform="translate(0 -6) rotate(-6 200 175)">
          <g class="cat">
            <!-- 身体 -->
            <ellipse cx="206" cy="176" rx="28" ry="16" fill="#3B2C5A"/>
            <!-- 尾巴翘起来 -->
            <path d="M232 181c12 3 18-4 17-13-1-7-6-10-11-8" fill="none"
                  stroke="#3B2C5A" stroke-width="6.5" stroke-linecap="round"/>
            <!-- 前爪搭在身前 -->
            <ellipse cx="168" cy="185" rx="12" ry="6.5" fill="#3B2C5A"/>
            <!-- 脑袋 -->
            <circle cx="176" cy="170" r="16" fill="#3B2C5A"/>
            <!-- 耳朵 -->
            <path d="M161 158 155 143l18 9z" fill="#3B2C5A"/>
            <path d="M178 152l10-10 3 15z" fill="#3B2C5A"/>
            <!-- 闭着的眼睛 -->
            <g stroke="#F2B95C" stroke-width="1.8" stroke-linecap="round" fill="none">
              <path d="M166 171q4 4 8 0"/>
              <path d="M179 170q4 4 8 0"/>
            </g>
            <!-- 鼻子 -->
            <circle cx="176" cy="180" r="1.6" fill="#F2B95C"/>
          </g>
        </g>
      </g>

      <g class="zzz">
        <text x="182" y="152">z</text>
        <text x="194" y="141">z</text>
        <text x="203" y="132">z</text>
      </g>

      <!-- 流星（脚本随机生成，放在最上层） -->
      <g id="meteors"></g>
    </svg>
  </div>

  <p class="clock rise" id="clock" style="--d:.14s">现在是 --:--</p>

  <h1 class="headline rise" id="headline" style="--d:.2s">瑞，该睡了哦</h1>

  <p class="note rise" id="note" style="--d:.32s">
    早点睡，别熬夜了。<br>
    <strong>明天的事，明天再说也来得及。</strong>
  </p>

  <button class="lamp rise" id="lamp" type="button" style="--d:.44s">好，我这就去睡</button>

</main>

<script>
(function () {
  'use strict';

  // ============ 只改这一块就行 ============
  const CONFIG = {
    name: '瑞',
    lines: {
      late:  '该睡了哦',            // 22:00 – 04:00
      later: '已经这么晚啦',         // 04:00 – 07:00
      early: '记得早点休息'          // 其它时间
    },
    note: '早点睡，别熬夜了。<br><strong>明天的事，明天再说也来得及。</strong>',
    asleep: {
      title: '晚安',
      note:  '灯关了。<br><strong>做个好梦。</strong>'
    },
    cta:     '好，我这就去睡',
    ctaBack: '开灯再看看'
  };
  // ========================================

  const clockEl = document.getElementById('clock');
  const headEl  = document.getElementById('headline');
  const noteEl  = document.getElementById('note');
  const btn     = document.getElementById('lamp');

  // 星星：网格抖动撒点，比纯随机均匀
  const stars = document.getElementById('stars');
  const frag = document.createDocumentFragment();
  for (let gx = 0; gx < 8; gx++) {
    for (let gy = 0; gy < 6; gy++) {
      const cx = gx * 50 + 8 + Math.random() * 36;
      const cy = gy * 46 + 8 + Math.random() * 32;
      if (Math.random() < 0.35) continue;
      if (Math.hypot(cx - 200, cy - 140) < 104) continue;
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', cx.toFixed(1));
      c.setAttribute('cy', cy.toFixed(1));
      c.setAttribute('r',  (Math.random() * 1.3 + 0.5).toFixed(1));
      c.style.animationDelay = (Math.random() * 4.5).toFixed(2) + 's';
      frag.appendChild(c);
    }
  }
  stars.appendChild(frag);

  // 流星：每隔一会儿随机冒一颗
  const meteors = document.getElementById('meteors');
  const SVG = 'http://www.w3.org/2000/svg';
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function spawnMeteor() {
    if (!calm && !document.body.classList.contains('asleep')) {
      const len = 30 + Math.random() * 34;
      const g  = document.createElementNS(SVG, 'g');
      const ln = document.createElementNS(SVG, 'line');

      ln.setAttribute('x1', 0);
      ln.setAttribute('y1', 0);
      ln.setAttribute('x2', len.toFixed(0));
      ln.setAttribute('y2', (-len * 0.55).toFixed(0));
      ln.setAttribute('stroke', 'url(#streak)');
      ln.setAttribute('stroke-width', (1.6 + Math.random() * 1.2).toFixed(1));
      ln.setAttribute('stroke-linecap', 'round');
      g.appendChild(ln);

      const dx = 110 + Math.random() * 110;

      // 满天撒，只避开月亮本身，让它出现在周围的黑色夜空里
      let x, y, tries = 0;
      do {
        x = 10 + Math.random() * 390;
        y = 10 + Math.random() * 290;
      } while (Math.hypot(x - 200, y - 128) < 88 && ++tries < 24);

      g.style.setProperty('--x',  x.toFixed(0) + 'px');
      g.style.setProperty('--y',  y.toFixed(0) + 'px');
      g.style.setProperty('--dx', dx.toFixed(0) + 'px');
      g.style.setProperty('--dy', (dx * 0.55).toFixed(0) + 'px');
      g.style.setProperty('--dur', (850 + Math.random() * 600).toFixed(0) + 'ms');
      g.classList.add('meteor');
      g.addEventListener('animationend', function () { g.remove(); });

      meteors.appendChild(g);
    }
    setTimeout(spawnMeteor, 500 + Math.random() * 1700);
  }

  setTimeout(spawnMeteor, 1200);

  function say(title) {
    headEl.textContent = (CONFIG.name ? CONFIG.name + '，' : '') + title;
  }

  function render() {
    const now = new Date();
    const h = now.getHours();
    clockEl.textContent = '现在是 ' +
      String(h).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    if (h >= 22 || h < 4)     say(CONFIG.lines.late);
    else if (h < 7)           say(CONFIG.lines.later);
    else                      say(CONFIG.lines.early);
  }

  let asleep = false;
  btn.addEventListener('click', function () {
    asleep = !asleep;
    document.body.classList.toggle('asleep', asleep);
    btn.textContent = asleep ? CONFIG.ctaBack : CONFIG.cta;
    if (asleep) {
      say(CONFIG.asleep.title);
      noteEl.innerHTML = CONFIG.asleep.note;
    } else {
      render();
      noteEl.innerHTML = CONFIG.note;
    }
  });

  render();
  setInterval(render, 30000);
})();
</script>
</body>
</html>
