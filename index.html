<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100E26">
<title>该睡了哦</title>
<style>
  :root {
    --night-0: #100E26;
    --cream: #F7EBD5;
    --cream-dim: #ADA6CE;
    --amber: #F2B95C;
    --ease: cubic-bezier(.34, 1.4, .64, 1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--night-0);
    color: var(--cream);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    transition: background .9s ease;
  }

  body.asleep { background: #08071A; }

  .page {
    width: min(100%, 460px);
    min-height: 100svh;
    padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
    position: relative;
  }

  /* ---------- 夜空 ---------- */
  .sky {
    position: relative;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 5 / 4;
  }

  .sky svg { width: 100%; height: 100%; overflow: visible; display: block; }

  .stars circle {
    fill: var(--cream);
    animation: twinkle 4.5s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: .25; }
    50%      { opacity: .85; }
  }

  body.asleep .stars circle { animation-duration: 9s; opacity: .18; }

  .halo { animation: breathe 7s ease-in-out infinite; transform-origin: 200px 118px; }

  @keyframes breathe {
    0%, 100% { opacity: .5;  transform: scale(1); }
    50%      { opacity: .8;  transform: scale(1.06); }
  }

  .zzz { opacity: 0; transition: opacity .8s ease; }

  body.asleep .zzz { opacity: 1; }

  .zzz text {
    fill: var(--cream-dim);
    font-size: 15px;
    font-family: ui-rounded, "SF Pro Rounded", sans-serif;
    animation: rise 3.6s ease-in-out infinite;
  }

  .zzz text:nth-child(2) { animation-delay: 1.2s; font-size: 12px; }
  .zzz text:nth-child(3) { animation-delay: 2.4s; font-size: 9px; }

  @keyframes rise {
    0%   { opacity: 0;   transform: translateY(6px); }
    30%  { opacity: .85; }
    100% { opacity: 0;   transform: translateY(-22px); }
  }

  /* ---------- 文案 ---------- */
  .clock {
    margin: 0;
    font-size: 13px;
    letter-spacing: .14em;
    color: var(--cream-dim);
    font-variant-numeric: tabular-nums;
  }

  .headline {
    margin: 0;
    font-size: clamp(32px, 9.5vw, 46px);
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: .02em;
  }

  .note {
    margin: 0;
    font-size: 16px;
    line-height: 1.8;
    color: var(--cream-dim);
    max-width: 26em;
  }

  .note strong {
    color: var(--cream);
    font-weight: 600;
  }

  /* ---------- 按钮 ---------- */
  .lamp {
    margin-top: 6px;
    min-height: 52px;
    padding: 0 30px;
    border: 0;
    border-radius: 999px;
    background: var(--amber);
    color: #2A1B05;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(242, 185, 92, .28);
    transition: transform .22s var(--ease), box-shadow .22s ease, background .3s ease;
  }

  .lamp:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(242,185,92,.36); }
  .lamp:active { transform: translateY(0) scale(.97); }
  .lamp:focus-visible { outline: 3px solid var(--cream); outline-offset: 5px; }

  body.asleep .lamp {
    background: transparent;
    color: var(--cream-dim);
    box-shadow: inset 0 0 0 1px rgba(247, 235, 213, .22);
  }

  /* 入场：一次编排好的淡入 */
  .page > * { animation: enter .9s var(--ease) both; }
  .page > *:nth-child(2) { animation-delay: .12s; }
  .page > *:nth-child(3) { animation-delay: .22s; }
  .page > *:nth-child(4) { animation-delay: .34s; }
  .page > *:nth-child(5) { animation-delay: .46s; }

  @keyframes enter {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<main class="page">

  <div class="sky" aria-hidden="true">
    <svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%">
          <stop offset="0%"   stop-color="#F2B95C" stop-opacity=".38"/>
          <stop offset="55%"  stop-color="#F2B95C" stop-opacity=".10"/>
          <stop offset="100%" stop-color="#F2B95C" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="moonFace" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FBD58C"/>
          <stop offset="100%" stop-color="#E9A646"/>
        </linearGradient>
        <mask id="boat">
          <rect x="0" y="0" width="400" height="320" fill="#000"/>
          <circle cx="200" cy="128" r="74" fill="#fff"/>
          <circle cx="200" cy="88"  r="68" fill="#000"/>
        </mask>
      </defs>

      <!-- 星 -->
      <g class="stars" id="stars"></g>

      <!-- 光晕 -->
      <circle class="halo" cx="200" cy="118" r="118" fill="url(#glow)"/>

      <!-- 月牙（船） -->
      <circle cx="200" cy="128" r="74" fill="url(#moonFace)" mask="url(#boat)"/>

      <!-- 睡在月亮上的猫 -->
      <g transform="rotate(-7 200 180)">
        <g fill="#3B2C5A">
          <ellipse cx="204" cy="180" rx="31" ry="13"/>
          <circle cx="172" cy="172" r="12"/>
          <path d="M162 164l-5-11 12 6z"/>
          <path d="M179 160l8-8 3 11z"/>
        </g>
        <path d="M233 181c12-1 15 7 6 10" fill="none" stroke="#3B2C5A"
              stroke-width="6" stroke-linecap="round"/>
        <!-- 闭着的眼睛 -->
        <g stroke="#F2B95C" stroke-width="1.5" stroke-linecap="round" fill="none">
          <path d="M165 174q3 3 6 0"/>
          <path d="M175 173q3 3 6 0"/>
        </g>
      </g>

      <!-- 关灯后飘起的 Zzz -->
      <g class="zzz">
        <text x="182" y="152">z</text>
        <text x="194" y="141">z</text>
        <text x="203" y="132">z</text>
      </g>
    </svg>
  </div>

  <p class="clock" id="clock">现在是 --:--</p>

  <h1 class="headline" id="headline">该睡了哦</h1>

  <p class="note" id="note">
    今天也辛苦了。<br>
    <strong>剩下的事，明天再做也来得及。</strong>
  </p>

  <button class="lamp" id="lamp" type="button">好，我这就去睡</button>

</main>

<script>
(function () {
  'use strict';

  // ============ 只改这一块就行 ============
  const CONFIG = {
    name: '',                       // 她的昵称，填了会变成「XX，该睡了哦」；留空不显示
    lines: {
      late:  '该睡了哦',            // 22:00 – 04:00
      later: '已经这么晚啦',         // 04:00 – 07:00
      early: '记得早点休息'          // 其它时间
    },
    note: '今天也辛苦了。<br><strong>剩下的事，明天再做也来得及。</strong>',
    asleep: {
      title: '晚安，做个好梦',
      note:  '灯关了。<br><strong>梦里见。</strong>'
    },
    cta:     '好，我这就去睡',
    ctaBack: '开灯再看看'
  };
  // ========================================

  const clockEl = document.getElementById('clock');
  const headEl  = document.getElementById('headline');
  const noteEl  = document.getElementById('note');
  const btn     = document.getElementById('lamp');

  // 星星：网格抖动撒点，比纯随机均匀，也省得手写一堆 circle
  const stars = document.getElementById('stars');
  const frag = document.createDocumentFragment();
  for (let gx = 0; gx < 8; gx++) {
    for (let gy = 0; gy < 6; gy++) {
      const cx = gx * 50 + 8 + Math.random() * 36;
      const cy = gy * 46 + 8 + Math.random() * 32;
      if (Math.random() < 0.35) continue;                       // 留白，别铺满
      if (Math.hypot(cx - 200, cy - 140) < 104) continue;       // 让开月亮
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', cx.toFixed(1));
      c.setAttribute('cy', cy.toFixed(1));
      c.setAttribute('r',  (Math.random() * 1.3 + 0.5).toFixed(1));
      c.style.animationDelay = (Math.random() * 4.5).toFixed(2) + 's';
      frag.appendChild(c);
    }
  }
  stars.appendChild(frag);

  function say(title) {
    headEl.textContent = (CONFIG.name ? CONFIG.name + '，' : '') + title;
  }

  function render() {
    const now = new Date();
    const h = now.getHours();
    clockEl.textContent = '现在是 ' +
      String(h).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    if (h >= 22 || h < 4)     say(CONFIG.lines.late);
    else if (h < 7)           say(CONFIG.lines.later);
    else                      say(CONFIG.lines.early);
  }

  let asleep = false;
  btn.addEventListener('click', function () {
    asleep = !asleep;
    document.body.classList.toggle('asleep', asleep);
    btn.textContent = asleep ? CONFIG.ctaBack : CONFIG.cta;
    if (asleep) {
      say(CONFIG.asleep.title);
      noteEl.innerHTML = CONFIG.asleep.note;
    } else {
      render();
      noteEl.innerHTML = CONFIG.note;
    }
  });

  render();
  setInterval(render, 30000);
})();
</script>
</body>
</html>
